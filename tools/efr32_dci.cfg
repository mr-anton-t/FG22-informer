# Official Series 2 device erase. This wipes main flash and opens debug.
# It does not write a new image.
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 50
reset_config none

source [find target/swj-dp.tcl]
swj_newdap efr32 cpu -irlen 4
dap create efr32.dap -chain-position efr32.cpu

proc dci_status {} {
  efr32.dap apreg 1 0x04 0x00001008
  return [efr32.dap apreg 1 0x0C]
}

proc dci_write {data} {
  set expiry [expr {[clock milliseconds] + 2000}]
  while {([dci_status] & 0x1) != 0} {
    if {[clock milliseconds] > $expiry} { error "DCI write timeout" }
    sleep 1
  }
  efr32.dap apreg 1 0x04 0x00001000
  efr32.dap apreg 1 0x0C $data
}

proc dci_read {} {
  set expiry [expr {[clock milliseconds] + 2000}]
  while {([dci_status] & 0x100) == 0} {
    if {[clock milliseconds] > $expiry} { error "DCI read timeout" }
    sleep 1
  }
  efr32.dap apreg 1 0x04 0x00001004
  return [efr32.dap apreg 1 0x0C]
}

proc dci_command {cmd} {
  dci_write 8
  dci_write $cmd
  set hdr [dci_read]
  echo [format "RESULT DCI_HDR 0x%08x" $hdr]
  set code [expr {$hdr >> 16}]
  set extra [expr {(($hdr & 0xFFFF) / 4) - 1}]
  if {$code != 0} { error [format "DCI response %d" $code] }
  set out {}
  for {set i 0} {$i < $extra} {incr i} {
    lappend out [dci_read]
  }
  return $out
}

if {[catch {init} msg]} {
  echo "RESULT FAIL $msg"
  shutdown
  exit 1
}

set idr [efr32.dap apreg 1 0xFC]
echo [format "RESULT AP_IDR 0x%08x" $idr]
if {$idr != 0x54770002} {
  echo "RESULT BAD_AP"
  shutdown
  exit 2
}

if {$ACTION eq "status"} {
  set words [dci_command 0xFE010000]
  echo "RESULT STATUS $words"
  shutdown
  exit 0
}

if {$ACTION eq "unlock"} {
  echo "RESULT ERASE_START"
  set words [dci_command 0x430F0000]
  echo "RESULT ERASE_OK $words"
  shutdown
  exit 0
}

echo "RESULT BAD_ACTION"
shutdown
exit 3
