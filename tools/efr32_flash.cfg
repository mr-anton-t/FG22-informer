# Program the 16-byte stub through the Series 2 MSC. No unlock, no mass erase.
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 200
reset_config none

source [find target/swj-dp.tcl]
swj_newdap efr32 cpu -irlen 4
dap create efr32.dap -chain-position efr32.cpu
target create efr32.cpu cortex_m -dap efr32.dap
efr32.cpu configure -work-area-phys 0x20000000 -work-area-size 0x1000 -work-area-backup 0
efr32.cpu cortex_m reset_config sysresetreq

set MSC 0x50030000
set CMU_CLKEN1_SET 0x50009068

proc msc_wait {} {
  set expiry [expr {[clock milliseconds] + 1000}]
  while {1} {
    set st [mrw 0x5003001c]
    if {($st & 0x1) == 0} { return $st }
    if {[clock milliseconds] > $expiry} { error [format "MSC busy 0x%08x" $st] }
  }
}

proc msc_write_word {addr data} {
  mww 0x50030014 $addr
  mww 0x50030010 0x1
  set expiry [expr {[clock milliseconds] + 200}]
  while {1} {
    set st [mrw 0x5003001c]
    if {($st & 0x8) != 0} { break }
    if {[clock milliseconds] > $expiry} { error [format "WDATAREADY timeout 0x%08x" $st] }
  }
  mww 0x50030018 $data
  mww 0x50030010 0x8
  set st [msc_wait]
  if {($st & 0x46) != 0} { error [format "write status 0x%08x" $st] }
}

if {[catch {init} msg]} {
  echo "RESULT FAIL $msg"
  shutdown
  exit 1
}
echo "RESULT LINK"
if {[catch {reset halt} msg]} {
  echo "RESULT HALT_FAIL $msg"
  shutdown
  exit 2
}

mww $CMU_CLKEN1_SET 0x00020000
mww 0x5003003c 0x1B71
mww 0x5003000c 0x1
mww 0x50030014 0x0
mww 0x50030010 0x1
msc_wait
mww 0x50030010 0x2
set st [msc_wait]
if {($st & 0x14) != 0} {
  echo [format "RESULT ERASE_FAIL 0x%08x" $st]
  shutdown
  exit 3
}

msc_write_word 0x00000000 0x20008000
msc_write_word 0x00000004 0x00000009
msc_write_word 0x00000008 0xE7FEB672
msc_write_word 0x0000000C 0x00000000

set w0 [mrw 0x00000000]
set w1 [mrw 0x00000004]
set w2 [mrw 0x00000008]
echo [format "RESULT READBACK 0x%08x 0x%08x 0x%08x" $w0 $w1 $w2]
if {$w0 != 0x20008000 || $w1 != 0x00000009 || $w2 != 0xE7FEB672} {
  echo "RESULT VERIFY_FAIL"
  shutdown
  exit 4
}
echo "RESULT FLASH_OK"
shutdown
exit 0
