# Связь с EFR32 по SWD. Стирания и unlock здесь нет.
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 50
reset_config none

source [find target/swj-dp.tcl]
swj_newdap efr32 cpu -irlen 4
dap create efr32.dap -chain-position efr32.cpu
target create efr32.cpu cortex_m -dap efr32.dap

if {[catch {init} msg]} {
  echo "RESULT FAIL $msg"
  shutdown
  exit 1
}

echo "RESULT LINK"
if {[catch {efr32.cpu arp_halt} msg]} {
  echo "RESULT HALT_FAIL $msg"
}
if {[catch {set words [mdw 0x00000000 4]} msg]} {
  echo "RESULT MEM_FAIL $msg"
  shutdown
  exit 2
}
echo "RESULT MEM $words"
if {[catch {dump_image DUMPPATH 0x00000000 0x80000} msg]} {
  echo "RESULT DUMP_FAIL $msg"
  shutdown
  exit 3
}
echo "RESULT DUMP_OK"
shutdown
