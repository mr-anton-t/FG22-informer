source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 50
reset_config none
source [find target/swj-dp.tcl]
swj_newdap efr32 cpu -irlen 4
dap create efr32.dap -chain-position efr32.cpu
target create efr32.cpu cortex_m -dap efr32.dap
init
echo "DP_OK"
catch { echo "HALT_ERR" } 
catch { efr32.cpu arp_halt }
catch { echo "PC [efr32.cpu mrw 0xE000ED00]" }
catch { mdw 0x00000000 4 }
shutdown
